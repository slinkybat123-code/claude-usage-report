<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Claude Usage</title>
  <meta name="description" content="Your Claude Code usage and spend, and your friends', on your phone.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icon-192.png">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Claude Usage">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <style>
    :root { color-scheme: light; --page: #f9f9f7; --surface: #ffffff; --surface-2: #efeee9; --ink: #0b0b0b; --ink-2: #4a4945; --muted: #5f5e59; --ring: rgba(11, 11, 11, 0.12); --track: #e4e3dd; --accent: #1f62b5; --blue: #2a78d6; --orange: #d4561f; --good: #0b8a0b; --warn: #b07800; --bad: #c22f2f; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --ink: #f0efec; --ink-2: #c9c8bf; --muted: #a3a198; --ring: rgba(255, 255, 255, 0.12); --track: #33332f; --accent: #2f6fc0; --blue: #3987e5; --orange: #eb6834; --good: #2fbf5f; --warn: #e0a826; --bad: #ef6b6b; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    main { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
    header { display: flex; align-items: center; gap: 12px; padding: 8px 0 14px; }
    header h1 { font-size: 24px; margin: 0; flex: 1; letter-spacing: -0.01em; }
    .tabs { display: inline-flex; border: 1px solid var(--ring); border-radius: 999px; padding: 3px; gap: 2px; }
    .tabs button { font: inherit; font-size: 15px; border: 0; background: transparent; color: var(--ink-2); padding: 0 16px; min-height: 40px; border-radius: 999px; cursor: pointer; }
    .tabs button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
    .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 20px; padding: 18px; margin-bottom: 12px; }
    .card h2 { font-size: 17px; margin: 0 0 10px; }
    .label { color: var(--muted); font-size: 14px; }
    .big { font-size: 52px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.05; margin: 4px 0 4px; font-variant-numeric: tabular-nums; }
    .fine { color: var(--muted); font-size: 13px; margin: 0; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .stat { background: var(--page); border-radius: 14px; padding: 12px; }
    .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .limit { margin: 12px 0 2px; }
    .limit-top { display: flex; justify-content: space-between; gap: 8px; }
    .meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 6px 0 4px; }
    .meter span { display: block; height: 100%; border-radius: 4px; background: var(--blue); transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .meter span.warn { background: var(--warn); } .meter span.bad { background: var(--bad); }
    .chat { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--ring); }
    .chat:first-of-type { border-top: 0; }
    .chat .n { color: var(--muted); font-size: 14px; }
    .chat .t { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat .c { font-variant-numeric: tabular-nums; font-weight: 600; }
    .chat .sub { grid-column: 2 / -1; font-size: 13px; color: var(--muted); }
    .chat .sub.active { color: var(--orange); }
    .lm { grid-column: 2 / -1; position: relative; height: 1.5em; font-size: 13px; color: var(--ink-2); overflow: hidden; white-space: nowrap;
      -webkit-mask-image: linear-gradient(90deg, #000 62%, transparent 98%); mask-image: linear-gradient(90deg, #000 62%, transparent 98%); }
    .lm > div { position: absolute; inset: 0; }
    .lm .who { font-weight: 650; color: var(--ink); margin-right: 6px; }
    .lm .who::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--blue); }
    .lm .who.claude::before { background: var(--orange); } .lm .who.notice::before { background: var(--muted); }
    .lm .out { animation: lm-out 0.55s ease-in forwards; }
    .lm .in .w, .lm .in .who { display: inline-block; animation: lm-word 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: calc(300ms + var(--w, 0) * 45ms); }
    @keyframes lm-word { from { opacity: 0; transform: translateY(7px); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes lm-out { to { opacity: 0; transform: translateY(-9px); filter: blur(4px); } }
    .row { display: flex; align-items: center; gap: 10px; }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
    .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .live.on i { background: var(--good); }
    input { font: inherit; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; width: 100%; min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--muted); background: var(--page); color: var(--ink); }
    input::placeholder { color: var(--muted); opacity: 1; letter-spacing: 0.04em; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .btn { font: inherit; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 20px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; }
    .btn.wide { width: 100%; }
    .btn:disabled { opacity: 0.6; }
    .link { font: inherit; background: none; border: 0; color: var(--blue); padding: 10px 0; min-height: 44px; cursor: pointer; text-align: left; }
    .err { color: var(--bad); font-size: 14px; margin: 8px 0 0; }
    .bar { height: 4px; border-radius: 2px; background: var(--track); margin-top: 4px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--orange); }
    .bar span.me { background: var(--blue); }
    .hint { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; }
    .hint p { margin: 0; flex: 1; }
    .hint button { font: inherit; background: none; border: 0; color: var(--blue); min-height: 32px; cursor: pointer; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Claude Usage</h1>
      <div class="tabs" role="group" aria-label="View" id="tabs" hidden>
        <button type="button" data-tab="me" aria-pressed="true">Me</button>
        <button type="button" data-tab="friends" aria-pressed="false">Friends</button>
      </div>
    </header>
    <div class="hint" id="hint" hidden><p>Install it: tap <b>Share</b>, then <b>Add to Home Screen</b>.</p><button type="button" id="hint-close" aria-label="Dismiss">Close</button></div>
    <div id="view"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
