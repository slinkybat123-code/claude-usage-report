<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Claude Usage Monitor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='8' width='3' height='7' rx='1' fill='%232a78d6'/%3E%3Crect x='6.5' y='4' width='3' height='11' rx='1' fill='%232a78d6'/%3E%3Crect x='12' y='1' width='3' height='14' rx='1' fill='%23eb6834'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login">
    <h1>Claude Usage Monitor</h1>
    <p class="lede">Enter the access key from the <b>Remote access</b> card on your PC's dashboard.</p>
    <form id="login" class="card" novalidate>
      <input type="text" name="username" value="claude-usage-monitor" autocomplete="username" hidden>
      <label for="key">Access key</label>
      <input id="key" name="key" type="password" autocomplete="current-password" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" required>
      <label class="check"><input type="checkbox" id="reveal"> Show key</label>
      <button class="primary" type="submit">Sign in</button>
      <p class="err" id="err" role="alert" hidden></p>
    </form>
    <p class="note">This device stays signed in for 30 days after its last visit.</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
