<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Claude Usage Report</title>
  <meta name="description" content="Live Claude Code usage and spend">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <style>
    :root { color-scheme: light; --page: #f9f9f7; --ink: #0b0b0b; --muted: #5f5e59; --ring: rgba(11, 11, 11, 0.14); --blue: #2a78d6; --orange: #eb6834; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --page: #0d0d0d; --ink: #f0efec; --muted: #a3a198; --ring: rgba(255, 255, 255, 0.16); --blue: #3987e5; --orange: #eb6834; }
    }
    html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--page); }
    #frame[hidden], .state[hidden] { display: none; }
    .state { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; text-align: center; }
    .mark { display: flex; gap: 6px; align-items: flex-end; justify-content: center; height: 40px; margin-bottom: 18px; }
    .mark i { width: 10px; border-radius: 3px; background: var(--blue); transform-origin: bottom; }
    .mark i:nth-child(1) { height: 18px; }
    .mark i:nth-child(2) { height: 28px; }
    .mark i:nth-child(3) { height: 40px; background: var(--orange); }
    .busy .mark i { animation: bob 1.1s ease-in-out infinite; }
    .busy .mark i:nth-child(2) { animation-delay: 0.12s; }
    .busy .mark i:nth-child(3) { animation-delay: 0.24s; }
    @keyframes bob { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.55); } }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
    p { color: var(--muted); margin: 0 auto 16px; max-width: 38ch; }
    button { font: inherit; min-height: 44px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--ring); background: transparent; color: var(--ink); cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .get { margin-top: 20px; font-size: 14px; }
    .get a { color: var(--blue); }
    @media (prefers-reduced-motion: reduce) { .busy .mark i { animation: none; } }
  </style>
</head>
<body>
  <main class="state busy" id="state">
    <div>
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1>Claude Usage Report</h1>
      <p id="msg" role="status">Finding your dashboard…</p>
      <button id="retry" type="button" hidden>Try again</button>
      <p class="get"><a href="get/">Get Claude Usage for your own PC</a></p>
    </div>
  </main>
  <iframe id="frame" hidden title="Claude Usage Report" referrerpolicy="no-referrer" allow="clipboard-write"></iframe>
  <script src="config.js"></script>
  <script src="site.js"></script>
</body>
</html>
